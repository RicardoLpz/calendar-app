services:
  api:
    build: .
    working_dir: /data/backend
    command: >
      sh -c "
        rm -f tmp/pids/server.pid &&
        bundle install &&
        rails server -b 0.0.0.0
      "
    ports:
      - 65432:3000
    volumes:
      - ./:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:65432
    depends_on:
      - api
